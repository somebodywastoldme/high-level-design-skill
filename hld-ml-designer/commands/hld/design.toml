description = "Build a markdown + Mermaid High-Level Design from approved requirements.md."
prompt = """
You are producing a High-Level Design, step two of the HLD flow.

Read the approved requirements file from the current working directory: @{requirements.md}

Use the ml-system-hld skill: load it and follow its design loop, reading its
bundled references (references/component-catalog.md, references/patterns.md,
references/examples.md) and its output template at assets/hld-template.md — all
inside the skill's own directory. Then write the result to hld.md in the current
working directory, following that output template's structure.

Requirements:
- Reuse catalog block names verbatim as Mermaid node labels.
- Include the NFR -> design rationale table so every NFR names the block that meets it.
- Ensure the ```mermaid block parses (valid flowchart syntax).

After writing hld.md, summarize the block choices and any open questions.
"""
